name: Portfolio checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-check:
    name: site-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate and build public files
        run: node scripts/release.mjs
      - name: Check responsive layout and public boundaries
        run: node scripts/check-browser.mjs
